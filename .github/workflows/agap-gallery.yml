name: Capture AGAP portfolio screenshots

on:
  push:
    paths:
      - '.github/workflows/agap-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render AGAP screenshots from its actual source code
        run: |
          git clone --depth 1 https://github.com/Reyseannn/AGAP.git /tmp/agap
          cd /tmp/agap/frontend
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/agap-http.log 2>&1 &
          sleep 2
          cd "$GITHUB_WORKSPACE"
          mkdir -p public/portfolio/assets
          node --input-type=module <<'JAVASCRIPT'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: {width: 1500, height: 900}, deviceScaleFactor: 1 });
          const base = 'http://127.0.0.1:8765';
          const screens = [
            {url:'/index.html',file:'agap-home.png'},
            {url:'/index.html#how-it-works',file:'agap-features.png',selector:'#how-it-works'},
            {url:'/staff/dashboard_admin.html',file:'agap-admin.png'},
            {url:'/signin.html',file:'agap-signin.png'},
            {url:'/verify.html',file:'agap-verify.png'}
          ];
          for(const s of screens) {
            await page.goto(base+s.url,{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(900);
            if(s.selector) await page.locator(s.selector).scrollIntoViewIfNeeded();
            await page.screenshot({path:'public/portfolio/assets/'+s.file,animations:'disabled'});
            console.log('Saved',s.file);
          }
          await browser.close();
          JAVASCRIPT
      - name: Commit AGAP screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portfolio/assets/agap-*.png
          if ! git diff --staged --quiet; then
            git commit -m "Add clear AGAP screenshots captured from source"
            git push
          fi
